<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101010" />
    <title>Vital Acoustica — Sound & lighting rental and production</title>
    <meta
      name="description"
      content="Sound and lighting hire with the crew to run it. d&amp;b audiotechnik V10P and B22 systems, beam moving heads, LED matrix and pixel bars, delivered, set up and operated."
    />
    <meta property="og:title" content="Vital Acoustica — Sound & lighting rental and production" />
    <meta property="og:description" content="Sound and lighting hire with the crew to run it: d&amp;b audiotechnik systems, beam and LED lighting, delivered, set up and operated." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vitalacoustica.com/" />
    <meta property="og:image" content="https://vitalacoustica.com/media/og.jpg" />
    <script>
      // apply the saved edition before first paint; the dark edition is the default
      try {
        var t = localStorage.getItem('va-theme')
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
