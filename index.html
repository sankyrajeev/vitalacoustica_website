<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030303" />
    <title>Vital Acoustica — Experience, Amplified.</title>
    <meta
      name="description"
      content="Vital Acoustica — pro audio, lighting and visual production for techno and house shows across South India. Based in Bangalore."
    />
    <meta property="og:title" content="Vital Acoustica — Experience, Amplified." />
    <meta
      property="og:description"
      content="Sound, lighting and visual production for techno and house shows of up to 1,000 people across South India."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vitalacoustica.com/" />
    <meta property="og:image" content="https://vitalacoustica.com/brand/logo-full-white.png" />
    <script>
      // apply the saved (or OS) colour theme before first paint to avoid a flash
      try {
        var t = localStorage.getItem('va-theme')
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = t
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
