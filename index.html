<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101010" />
    <title>Vital Acoustica — We shape the way an experience feels.</title>
    <meta
      name="description"
      content="Vital Acoustica is an independent creative production house. Sound, light and production, conceived as one."
    />
    <meta property="og:title" content="Vital Acoustica — We shape the way an experience feels." />
    <meta property="og:description" content="Sound, light and production. Conceived as one." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vitalacoustica.com/" />
    <meta property="og:image" content="https://vitalacoustica.com/media/og.jpg" />
    <script>
      // apply the saved edition before first paint; the dark edition is the default
      try {
        var t = localStorage.getItem('va-theme')
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
